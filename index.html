<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Human Invaders</title>
<style>
  :root { --bg: #000; --fg: #9fd; --dim: #577; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #wrap { position: relative; width: min(100vw - 32px, (100vh - 80px) * 4 / 3); aspect-ratio: 4 / 3; }
  canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; background: #000; }
  #sound { position: absolute; top: 8px; right: 8px; padding: 4px 8px; background: rgba(0,0,0,.7);
    color: var(--fg); border-radius: 4px; font-size: 12px; pointer-events: none; }
  p { color: var(--dim); margin: 10px 16px; text-align: center; }
  button#fs { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--dim);
    border-radius: 4px; padding: 2px 10px; margin-left: 8px; cursor: pointer; }
  button#fs:hover { border-color: var(--fg); }
  /* fullscreen: black stage, picture as large as possible at 4:3 */
  #wrap:fullscreen { width: 100vw; height: 100vh; aspect-ratio: auto; background: #000;
    display: flex; align-items: center; justify-content: center; cursor: none; }
  #wrap:fullscreen canvas { width: min(100vw, 100vh * 4 / 3); height: min(100vh, 100vw * 3 / 4); }
  #wrap:-webkit-full-screen { width: 100vw; height: 100vh; background: #000;
    display: flex; align-items: center; justify-content: center; cursor: none; }
  #wrap:-webkit-full-screen canvas { width: min(100vw, 100vh * 4 / 3); height: min(100vh, 100vw * 3 / 4); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="screen" width="320" height="200"></canvas>
  <div id="sound" hidden>click or press a key for sound</div>
</div>
<p>Arrows / numpad: move &middot; Space: fire / select &middot; Enter: confirm &middot; Q: give up<br>Gamepad: d-pad / stick move &middot; A: fire &middot; B / Start: confirm<br>
Fullscreen: double-click the picture or Alt+Enter <button id="fs" type="button" hidden>Fullscreen</button></p>
<script src="main.js"></script>
</body>
</html>
