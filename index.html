<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>Human Invaders</title>
<style>
  :root { --bg: #000; --fg: #9fd; --dim: #577; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #wrap { position: relative; width: min(100vw - 32px, (100vh - 80px) * 4 / 3); aspect-ratio: 4 / 3; }
  canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; background: #000; }
  #sound { position: absolute; top: 8px; right: 8px; padding: 4px 8px; background: rgba(0,0,0,.7);
    color: var(--fg); border-radius: 4px; font-size: 12px; pointer-events: none; }
  p { color: var(--dim); margin: 10px 16px; text-align: center; }
  a#fs { color: var(--fg); margin-left: 8px; }
  /* fullscreen (and the in-window fallback): black stage, picture as large
     as possible at 4:3. Driven by a class so it doesn't depend on :fullscreen. */
  body.max { overflow: hidden; }
  body.max #wrap { position: fixed; inset: 0; width: auto; height: auto; aspect-ratio: auto;
    background: #000; display: flex; align-items: center; justify-content: center; z-index: 10; cursor: none; }
  body.max canvas { width: min(100vw, 100vh * 4 / 3); height: min(100vh, 100vw * 3 / 4); }
  @supports (height: 100dvh) {
    body.max canvas { width: min(100dvw, 100dvh * 4 / 3); height: min(100dvh, 100dvw * 3 / 4); }
  }
  body.max p { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="screen" width="320" height="200"></canvas>
  <div id="sound" hidden>click or press a key for sound</div>
</div>
<p>Arrows / numpad: move &middot; Space: fire / select &middot; Enter: confirm &middot; Q: give up<br>Gamepad: d-pad / stick move &middot; A: fire &middot; B / Start: confirm<br>
<a href="#" id="fs" role="button">Fullscreen</a> (or double-click the picture, Alt+Enter; Esc leaves)</p>
<script src="main.js"></script>
</body>
</html>
